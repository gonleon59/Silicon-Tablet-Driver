name: Silicon Tablet Driver macOS preview
on:
  workflow_dispatch:
  push:
    branches: [silicon-preview, 0.6.x, main]
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Directory.Build.props'
      - 'global.json'
      - 'eng/**'
      - '.github/workflows/bamboo-macos.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test OpenTabletDriver.Tests -c Release --nologo
      - name: Verify native settings search
        run: |
          swiftc -swift-version 5 eng/macos/BambooSettingsSearch.swift eng/macos/tests/SettingsSearchTests.swift -o "$RUNNER_TEMP/bamboo-search-tests"
          "$RUNNER_TEMP/bamboo-search-tests"
      - name: Verify native numeric input
        run: |
          swiftc -swift-version 5 eng/macos/BambooNumericInput.swift eng/macos/tests/NumericInputTests.swift -o "$RUNNER_TEMP/bamboo-numeric-tests"
          "$RUNNER_TEMP/bamboo-numeric-tests"
      - run: brew install bash coreutils
      - name: Package ARM64
        run: OTD_BUILD_NUMBER=${{ github.run_number }} VERSION_SUFFIX=-bamboo27 /opt/homebrew/bin/bash build.sh --runtime osx-arm64 --signed true --output release-artifacts
      - name: Verify package
        run: |
          codesign --verify --deep --strict release-artifacts/OpenTabletDriver.app
          file release-artifacts/OpenTabletDriver.app/Contents/MacOS/OpenTabletDriver.UX.MacOS
          cd release-artifacts
          shasum -a 256 *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: silicon-tablet-driver-macos-arm64-preview
          path: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS
          if-no-files-found: error
